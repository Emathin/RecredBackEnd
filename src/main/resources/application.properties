spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/recred_local?prepareThreshold=0}
spring.datasource.username=${DB_USERNAME:usuario_local}
spring.datasource.password=${DB_PASSWORD:password_local}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.application.name=recreopago-backend
logging.structured.format.console=logstash
logging.structured.json.context.include=true

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000

spring.security.oauth2.resourceserver.jwt.issuer-uri=${COGNITO_ISSUER_URI:https://cognito-idp.us-east-2.amazonaws.com/us-east-2_Qzg5XbEUj}
spring.security.oauth2.resourceserver.jwt.audiences=${COGNITO_CLIENT_ID:481p8i3df23fo4ql3psj9e1tbk}

cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:https://recred.netlify.app,http://localhost:*,http://127.0.0.1:*}

gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.1-flash-lite}
gemini.enabled=${GEMINI_ENABLED:true}

statistical-alert.enabled=${STATISTICAL_ALERT_ENABLED:true}
statistical-alert.cron=${STATISTICAL_ALERT_CRON:0 0 9 * * *}
statistical-alert.lookback-days=${STATISTICAL_ALERT_LOOKBACK_DAYS:30}
statistical-alert.minimum-purchases-for-pattern=${STATISTICAL_ALERT_MIN_PURCHASES:3}
statistical-alert.pattern-cooldown-days=${STATISTICAL_ALERT_PATTERN_COOLDOWN_DAYS:7}
statistical-alert.healthy-recommendation-cooldown-days=${STATISTICAL_ALERT_HEALTHY_COOLDOWN_DAYS:14}
statistical-alert.minimum-product-quantity-for-suggestion=${STATISTICAL_ALERT_MIN_PRODUCT_QUANTITY:2}

healthy-recommendation.enabled=${HEALTHY_RECOMMENDATION_ENABLED:true}
healthy-recommendation.cron=${HEALTHY_RECOMMENDATION_CRON:0 30 9 * * *}
healthy-recommendation.lookback-days=${HEALTHY_RECOMMENDATION_LOOKBACK_DAYS:2}
healthy-recommendation.minimum-repeated-days=${HEALTHY_RECOMMENDATION_MIN_REPEATED_DAYS:2}
healthy-recommendation.cooldown-days=${HEALTHY_RECOMMENDATION_COOLDOWN_DAYS:3}
healthy-recommendation.max-history-items=${HEALTHY_RECOMMENDATION_MAX_HISTORY_ITEMS:10}
healthy-recommendation.max-available-options=${HEALTHY_RECOMMENDATION_MAX_AVAILABLE_OPTIONS:20}

firebase.enabled=${FIREBASE_ENABLED:false}
firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:}


spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
