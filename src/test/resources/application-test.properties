spring.docker.compose.file=docker-compose-test.yml
spring.docker.compose.lifecycle-management=start-and-stop
spring.docker.compose.skip.in-tests=false
spring.datasource.url=jdbc:postgresql://localhost:5433/recred_test
spring.datasource.username=test_user
spring.datasource.password=test_pass

spring.jpa.hibernate.ddl-auto=create-drop
statistical-alert.enabled=false
firebase.enabled=false

mercadopago.access-token=test-token
mercadopago.webhook-secret=test-secret
mercadopago.success-url=http://localhost:4200/success
mercadopago.failure-url=http://localhost:4200/failure
mercadopago.pending-url=http://localhost:4200/pending
mercadopago.notification-url=http://localhost:8080/webhook
