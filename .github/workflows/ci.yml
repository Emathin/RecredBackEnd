name: Java CI with Maven

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Revisar calidad de código con Checkstyle
        run: mvn checkstyle:check

      - name: Compilar y correr tests
        run: mvn clean package

      - name: Verificar contenido de la carpeta target (Para ver el nombre real del .jar)
        run: ls -la target/

      - name: Copiar el archivo .jar a AWS EC2
        if: github.ref == 'refs/heads/main'
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_SSH_KEY }}
          source: "target/backend-0.0.1-SNAPSHOT.jar" # Revisa que este nombre coincida con tu .jar
          target: "/home/ubuntu/recred-app"
          strip_components: 1

      - name: Ejecutar y reiniciar el servicio en AWS
        if: github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            sudo systemctl restart recred.service