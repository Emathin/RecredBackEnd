name: Java CI/CD with Maven

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  ci:
    name: Build, lint, test and verify
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Dar permisos a mvnw
        run: chmod +x mvnw

      - name: Revisar calidad de código con Checkstyle
        run: ./mvnw checkstyle:check

      - name: Compilar, testear y verificar
        run: ./mvnw clean verify
        env:
          COGNITO_ISSUER_URI: ${{ secrets.COGNITO_ISSUER_URI }}

      - name: Ver contenido de target
        run: ls -la target/

  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: ci

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Generar JAR
        run: ./mvnw clean package -DskipTests

      - name: Ver contenido de target
        run: ls -la target/

      - name: Copiar JAR a AWS EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_SSH_KEY }}
          source: "target/backend-0.0.1-SNAPSHOT.jar"
          target: "/home/ubuntu/recred-app"

      - name: Reiniciar servicio en AWS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            sudo systemctl restart recred.service