name: Java CI/CD with Maven and Docker

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  ci:
    name: Build, lint, test and verify
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Dar permisos a mvnw
        run: chmod +x mvnw

      - name: Revisar calidad de codigo con Checkstyle
        run: ./mvnw checkstyle:check

      - name: Compilar, testear y verificar
        run: ./mvnw clean verify

      - name: Ver contenido de target
        run: ls -la target/

  deploy:
    name: Deploy Docker image to AWS EC2
    runs-on: ubuntu-latest
    needs: ci

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Dar permisos a mvnw
        run: chmod +x mvnw

      - name: Construir imagen Docker
        run: |
          docker build \
            -t recred-backend:${{ github.sha }} \
            -t recred-backend:latest \
            .

      - name: Guardar imagen Docker
        run: docker save recred-backend:${{ github.sha }} | gzip > recred-backend.tar.gz

      - name: Copiar imagen y compose a AWS EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_SSH_KEY }}
          source: "recred-backend.tar.gz,docker-compose.yml"
          target: "/home/ubuntu/recred-app"

      - name: Levantar contenedores en AWS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/recred-app

            if [ ! -f .env ]; then
              echo "Falta /home/ubuntu/recred-app/.env con las variables del backend y PostgreSQL"
              exit 1
            fi

            sudo systemctl stop recred.service || true
            sudo docker rm -f recred-backend || true
            sudo docker load -i recred-backend.tar.gz
            sudo env BACKEND_IMAGE=recred-backend:${{ github.sha }} docker compose up -d --no-build
            sudo docker image prune -f
